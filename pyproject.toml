[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-diploma-mec"
version = "0.1.0"
description = "Geração e validação de XML do Diploma Digital MEC a partir de XSD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5,<7",
  "xsdata>=24,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "xmlschema>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
